<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="pageTitle">Instagram Viral Videos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }
    h1 {
      font-size: 26px;
      margin: 10px 0;
    }
    p {
      font-size: 16px;
    }
    .btn {
      display: block;
      background-color: #4CAF50;
      color: white;
      padding: 14px;
      border-radius: 10px;
      width: 95%;
      max-width: 400px;
      margin: 15px auto;
      font-size: 18px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
    }
    .image-preview {
      width: 100%;
      max-width: 400px;
      margin: 10px auto;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <img id="headerImage" src="" class="profile-pic" alt="Profile" />
  <h1 id="titleText">Instagram Viral Videos</h1>
  <p>🔥 All links from bio — click to open!</p>
  <a id="telegramLink" href="#" class="btn" target="_blank">📢 Join Telegram</a>

  <div id="posts"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDeh2YAbTvupfNhEbT1uDBvoNiW1KQU9-o",
      authDomain: "trending-viral-links.firebaseapp.com",
      databaseURL: "https://trending-viral-links-default-rtdb.firebaseio.com",
      projectId: "trending-viral-links",
      storageBucket: "trending-viral-links.appspot.com",
      messagingSenderId: "803173160374",
      appId: "1:803173160374:web:fc0bb2ab64564f59ee9d17"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const postsContainer = document.getElementById("posts");

    db.ref("meta").once("value", (snap) => {
      const meta = snap.val();
      if (meta) {
        document.getElementById("pageTitle").innerText = meta.title || "Instagram Viral Videos";
        document.getElementById("titleText").innerText = meta.title || "Instagram Viral Videos";
        document.getElementById("headerImage").src = meta.image || "https://i.imgur.com/Cv0Rj5z.png";
        document.getElementById("telegramLink").href = meta.telegram || "#";
      }
    });

    db.ref("posts").on("value", (snapshot) => {
      postsContainer.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(key => {
          const post = data[key];
          if (post.image) {
            const img = document.createElement("img");
            img.src = post.image;
            img.className = "image-preview";
            postsContainer.appendChild(img);
          }
          const a = document.createElement("a");
          a.href = post.link;
          a.className = "btn";
          a.target = "_blank";
          a.innerText = post.text;
          postsContainer.appendChild(a);
        });
      }
    });
  </script>
</body>
</html>
